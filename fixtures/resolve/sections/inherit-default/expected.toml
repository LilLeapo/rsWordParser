# RES-10 节继承校准（任务 5.8）。观察值必须来自真实 Word：
# 在 Word 里打开 doc.docx，看**第二页**（第二节）的页眉显示什么。
# 第二节自己没有 headerReference：Word 会继续显示第一节的页眉，还是空的？
# 把 header_default 填成看到的文字（空则填 ""），verified 改成 true。

doc = "sections/inherit-default"

[[section]]
idx = 0
header_default = "第一节页眉"
inherited_from = -1
verified = false

[[section]]
idx = 1
header_default = "第一节页眉"
inherited_from = 0
verified = false
