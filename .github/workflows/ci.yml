name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # TEST-03 / TEST-10 M1 门：synthetic 文本段落用例与 TS 的差分为 0（KNOWN_DIFFS 除外）
      - run: cargo run -p diff-parse -- --scope text
      # TEST-10 M2 门：再放开字段 / 范围标记 / 批注 / 注释的用例（文本域的超集）
      - run: cargo run -p diff-parse -- --scope fields
      # TEST-10 M3 门：再放开表格的用例（字段域的超集；单元格里的绘图归 M4）
      - run: cargo run -p diff-parse -- --scope tables
      # TEST-10 M4 门：全部用例里绘图域（image* / textboxes[] / rule* / oleProgId）的差分为 0
      - run: cargo run -p diff-parse -- --scope drawing
      # TEST-10 M5 门：全部用例里页眉页脚域（hfParts / header* / footer* / watermarkText）的差分为 0
      - run: cargo run -p diff-parse -- --scope hf
      # TEST-10 M6 门：全部用例里嵌入对象域（chartDisplay / diagramDisplay / formulaDisplay / inks / 嵌入块上的字段）的差分为 0。
      # M6 门（嵌入对象域，6.8 起归零；6.2–6.7 期间曾用 --max-unknown 做棘轮：214 → 170 → 160 → 43）
      - run: cargo run -p diff-parse -- --scope embedded
      # TEST-10 第八道门（M6 6.9）：全部语料、全部路径的差分除 KNOWN_DIFFS.md 外为 0
      - run: cargo run -p diff-parse -- --scope all
      # 真实 Word 语料（docs/07，2026-09-07 收到 124 份）：TS 参考输出的差分除 KNOWN_DIFFS.md 外为 0
      - run: cargo run -p diff-parse -- --corpus corpus/real
      # M7 7.10：ParsedDoc 走 JS 绑定那条路，两个语料上都必须与原生一模一样
      - run: cargo run -p diff-parse -- --scope all --via js
      - run: cargo run -p diff-parse -- --corpus corpus/real --via js
      # JS 绑定的 wasm 产物构建得出来（`wasm-bindgen` 的后处理在发布流程里做，不在这道门）
      - run: cargo build -p rsword-js --profile wasm-release --target wasm32-unknown-unknown
  # fuzz 在 .github/workflows/fuzz.yml（手动 / 每周）、TEST-07 的 1,000 条随机序列在
  # random.yml（每天），都不挂在每次 push 上；`cargo test --workspace` 里已经跑了缺省的 100 条。
