name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # TEST-03 / TEST-10 M1 门：synthetic 文本段落用例与 TS 的差分为 0（KNOWN_DIFFS 除外）
      - run: cargo run -p diff-parse -- --scope text
      # TEST-10 M2 门：再放开字段 / 范围标记 / 批注 / 注释的用例（文本域的超集）
      - run: cargo run -p diff-parse -- --scope fields
      # TEST-10 M4 门：全部用例里绘图域（image* / textboxes[] / rule* / oleProgId）的差分为 0
      - run: cargo run -p diff-parse -- --scope drawing
  # fuzz 在 .github/workflows/fuzz.yml（手动 / 每周），不挂在每次 push 上。
