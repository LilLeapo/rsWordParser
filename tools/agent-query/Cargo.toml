[package]
name = "rsword-agent-query"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[dependencies]
rsword = { path = "../../crates/rsword" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "=1.13.1"
unicode-normalization = "=0.1.25"
[features]
compat-ts = ["rsword/compat-ts"]
[[bin]]
name = "rsword-query-worker"
path = "src/worker.rs"
[lints]
workspace = true
[dev-dependencies]
zip.workspace = true
