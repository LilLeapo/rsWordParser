[package]
name = "rsword-agent-query"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[dependencies]
rsword = { path = "../../crates/rsword" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
regex = "=1.13.1"
unicode-normalization = "=0.1.25"
sha2 = "=0.10.9"
[features]
compat-ts = ["rsword/compat-ts"]
[[bin]]
name = "rsword-query-worker"
path = "src/worker.rs"
[[bench]]
name = "agent"
harness = false
[lints]
workspace = true
[dev-dependencies]
zip.workspace = true
jsonschema = "0.55.0"
