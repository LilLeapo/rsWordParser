[package]
name = "rsword"
version = "0.0.1"
description = "高保真 DOCX 编辑内核：无损解析、局部补丁写回（docs/03 架构 v3.2）"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
zip.workspace = true
memchr.workspace = true
thiserror.workspace = true
# compat_ts 适配器的 ParsedDoc JSON（COMPAT-02）与差分工具
serde_json = "1"

[dev-dependencies]
# `RES-12` fixture 的 `expected.toml`（任务 5.8）；只在测试里用
toml = "1.1"

[build-dependencies]
# 属性表（schema/props/*.toml，PROP-01）的读取；只在构建脚本里用
toml = "1.1"
serde = { version = "1", features = ["derive"] }

# 性能记录（`spec/18` 7.9，非门）：不引 bench 框架，自己计时
[[bench]]
name = "edit"
harness = false

[lints]
workspace = true
