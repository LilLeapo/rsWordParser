[[table]]
name = "PageBorders"
element = "w:pgBorders"
doc = "CT_PageBorders（§17.6.10）：四边共用 `CT_Border`（与 `w:pBdr` 一样是 top/left/bottom/right，没有 Strict 的 start/end 改名）。"
order = ["w:top", "w:left", "w:bottom", "w:right"]
attrs = [
  { name = "z_order", attr = "w:zOrder", codec = "PageBorderZOrder", doc = "边框画在文字前还是后" },
  { name = "display", attr = "w:display", codec = "PageBorderDisplay", doc = "哪些页画边框；缺省 allPages" },
  { name = "offset_from", attr = "w:offsetFrom", codec = "PageBorderOffset", doc = "各边 `w:space` 的基准：页边缘还是文字区" },
]

[[table.field]]
name = "top"
element = "w:top"
codec = "Border"

[[table.field]]
name = "left"
element = "w:left"
codec = "Border"

[[table.field]]
name = "bottom"
element = "w:bottom"
codec = "Border"

[[table.field]]
name = "right"
element = "w:right"
codec = "Border"

[[table]]
name = "Columns"
element = "w:cols"
doc = "CT_Columns（§17.6.4）：栏数与栏间距在属性上，不等宽时才有 `w:col` 子元素（最多 45 个）。`w:space` 的 OOXML 缺省是 720。"
order = ["w:col"]
attrs = [
  { name = "equal_width", attr = "w:equalWidth", codec = "OnOff" },
  { name = "space", attr = "w:space", codec = "Twips" },
  { name = "num", attr = "w:num", codec = "Int" },
  { name = "sep", attr = "w:sep", codec = "OnOff", doc = "栏间画分隔线" },
]

[[table.field]]
name = "col"
element = "w:col"
codec = "Column"
multi = true
