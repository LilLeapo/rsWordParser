doc = "ST_TblWidth（§17.18.90）：`w` 的单位——auto / dxa（twips）/ nil / pct（1/50 百分点）"
values = ["nil", "pct", "dxa", "auto"]

[enum.MergeKind]
doc = "ST_Merge（§17.18.57）：vMerge / hMerge 的 `w:val`；元素存在而无 `w:val` 即 continue"
values = ["continue", "restart"]

[enum.VerticalJc]
doc = "ST_VerticalJc（§17.18.101）：单元格垂直对齐"
values = ["top", "center", "both", "bottom"]

[enum.TextDirection]
doc = "ST_TextDirection（§17.18.93）：Transitional（lrTb…）与 Strict（tb…）两套字面都收"
values = ["lrTb", "tbRl", "btLr", "lrTbV", "tbRlV", "tbLrV", "tb", "rl", "lr", "tbV", "rlV", "lrV"]

[enum.TblLayoutType]
doc = "ST_TblLayoutType（§17.18.87）"
values = ["fixed", "autofit"]

[enum.TblOverlap]
doc = "ST_TblOverlap（§17.18.88）：浮动表格是否允许与别的浮动表格重叠"
values = ["never", "overlap"]

[enum.JcTable]
doc = "ST_JcTable（§17.18.45）：表格 / 行的水平对齐；Strict 没有 left/right"
values = ["center", "end", "left", "right", "start"]

[enum.AnnotationVMerge]
doc = "ST_AnnotationVMerge（§17.18.1）：cellMerge 修订里的合并方向"
values = ["cont", "rest"]

# ---- 表格属性用到的结构体 -----------------------------------------------------------------------

[struct.TblWidth]
doc = "CT_TblWidth（`w:tblW` / `w:tcW` / `w:tblInd` / `w:tblCellSpacing` / `w:wBefore` / `w:wAfter` / 单元格边距各边）：`w` 的单位由 `type` 决定（dxa = twips，pct = 1/50 百分点；字面 `NN%` 也接受）。解释见 `TblWidth::twips` / `TblWidth::percent`。"
attrs = [
  { name = "w", attr = "w:w", codec = "MeasureOrPercent" },
  { name = "kind", attr = "w:type", codec = "TblWidthType" },
]

[struct.TblLayout]
doc = "CT_TblLayoutType（`w:tblLayout`）：属性是 `w:type` 而不是 `w:val`"
attrs = [{ name = "kind", attr = "w:type", codec = "TblLayoutType" }]

[struct.TblLook]
doc = "CT_TblLook（`w:tblLook`）：表格样式条件格式开关。属性形式优先于 `w:val` 位掩码（RES-08）。"
attrs = [
  { name = "val", attr = "w:val", codec = "Str", doc = "ST_ShortHexNumber 位掩码原文（0x20 firstRow … 0x400 noVBand）" },
  { name = "first_row", attr = "w:firstRow", codec = "OnOff" },
  { name = "last_row", attr = "w:lastRow", codec = "OnOff" },
  { name = "first_column", attr = "w:firstColumn", codec = "OnOff" },
  { name = "last_column", attr = "w:lastColumn", codec = "OnOff" },
  { name = "no_h_band", attr = "w:noHBand", codec = "OnOff" },
  { name = "no_v_band", attr = "w:noVBand", codec = "OnOff" },
]

[struct.TblpPr]
doc = "CT_TblPPr（`w:tblpPr`）：浮动表格的定位与环绕距离"
attrs = [
  { name = "left_from_text", attr = "w:leftFromText", codec = "Twips" },
  { name = "right_from_text", attr = "w:rightFromText", codec = "Twips" },
  { name = "top_from_text", attr = "w:topFromText", codec = "Twips" },
  { name = "bottom_from_text", attr = "w:bottomFromText", codec = "Twips" },
  { name = "vert_anchor", attr = "w:vertAnchor", codec = "FrameAnchor" },
  { name = "horz_anchor", attr = "w:horzAnchor", codec = "FrameAnchor" },
  { name = "tblp_x_spec", attr = "w:tblpXSpec", codec = "XAlign" },
  { name = "tblp_x", attr = "w:tblpX", codec = "Twips" },
  { name = "tblp_y_spec", attr = "w:tblpYSpec", codec = "YAlign" },
  { name = "tblp_y", attr = "w:tblpY", codec = "Twips" },
]

[struct.Merge]
doc = "CT_VMerge / CT_HMerge（`w:vMerge` / `w:hMerge`）：元素存在而无 `w:val` 即 continue，`val` 只有 restart 才写。见 `Merge::is_restart`。"
attrs = [{ name = "val", attr = "w:val", codec = "MergeKind" }]

[struct.TrHeight]
doc = "CT_Height（`w:trHeight`）：行高 twips 与规则；Word 上限 31680（RES-08 截断，模型保持原值）"
attrs = [
  { name = "val", attr = "w:val", codec = "Twips" },
  { name = "h_rule", attr = "w:hRule", codec = "HeightRule" },
]

[struct.CnfStyle]
doc = "CT_Cnf（`w:cnfStyle`）：条件格式位图（12 位 0/1 字符串）与逐位属性"
attrs = [
  { name = "val", attr = "w:val", codec = "Str" },
  { name = "first_row", attr = "w:firstRow", codec = "OnOff" },
  { name = "last_row", attr = "w:lastRow", codec = "OnOff" },
  { name = "first_column", attr = "w:firstColumn", codec = "OnOff" },
  { name = "last_column", attr = "w:lastColumn", codec = "OnOff" },
  { name = "odd_v_band", attr = "w:oddVBand", codec = "OnOff" },
  { name = "even_v_band", attr = "w:evenVBand", codec = "OnOff" },
  { name = "odd_h_band", attr = "w:oddHBand", codec = "OnOff" },
  { name = "even_h_band", attr = "w:evenHBand", codec = "OnOff" },
  { name = "first_row_first_column", attr = "w:firstRowFirstColumn", codec = "OnOff" },
  { name = "first_row_last_column", attr = "w:firstRowLastColumn", codec = "OnOff" },
  { name = "last_row_first_column", attr = "w:lastRowFirstColumn", codec = "OnOff" },
  { name = "last_row_last_column", attr = "w:lastRowLastColumn", codec = "OnOff" },
]

[struct.TrackChangeMark]
doc = "CT_TrackChange（`trPr/w:ins` / `trPr/w:del` / `w:cellIns` / `w:cellDel`）：修订标记的 id / 作者 / 日期"
attrs = [
  { name = "id", attr = "w:id", codec = "Int" },
  { name = "author", attr = "w:author", codec = "Str" },
  { name = "date", attr = "w:date", codec = "Str" },
]

[struct.CellMergeMark]
doc = "CT_CellMergeTrackChange（`w:cellMerge`）：单元格合并修订"
attrs = [
  { name = "id", attr = "w:id", codec = "Int" },
  { name = "author", attr = "w:author", codec = "Str" },
  { name = "date", attr = "w:date", codec = "Str" },
  { name = "v_merge", attr = "w:vMerge", codec = "AnnotationVMerge" },
  { name = "v_merge_orig", attr = "w:vMergeOrig", codec = "AnnotationVMerge" },
]

# ---- 节属性用到的枚举（任务 5.1）-------------------------------------------------------------------

[enum.SectType]
doc = "ST_SectionMark（§17.18.78）：分节符类型；缺省 nextPage"
values = ["nextPage", "nextColumn", "continuous", "evenPage", "oddPage"]

[enum.HdrFtrType]
doc = "ST_HdrFtr（§17.18.36）：页眉页脚引用的种类。另收非 schema 的 `odd`——Word 之外的生成器写它表示「缺省页」，TS 与 Word 都当 default 处理（`RES-10`），当成 `Val::Raw` 会白记一条 PROP_BAD_VALUE。"
values = ["even", "default", "first", "odd"]

[enum.PageOrient]
doc = "ST_PageOrientation（§17.18.65）"
values = ["portrait", "landscape"]

[enum.ChapterSep]
doc = "ST_ChapterSep（§17.18.6）：章号与页码之间的分隔符"
values = ["hyphen", "period", "colon", "emDash", "enDash"]

[enum.LineNumberRestart]
doc = "ST_LineNumberRestart（§17.18.47）"
values = ["newPage", "newSection", "continuous"]

[enum.PageBorderZOrder]
doc = "ST_PageBorderZOrder（§17.18.64）"
values = ["front", "back"]

[enum.PageBorderDisplay]
doc = "ST_PageBorderDisplay（§17.18.62）"
values = ["allPages", "firstPage", "notFirstPage"]

[enum.PageBorderOffset]
doc = "ST_PageBorderOffset（§17.18.63）"
values = ["page", "text"]

[enum.DocGridType]
doc = "ST_DocGrid（§17.18.14）：行网格类型（中文公文排版的关键）"
values = ["default", "lines", "linesAndChars", "snapToChars"]

[enum.FootnotePos]
doc = "ST_FtnPos（§17.18.32）：脚注位置"
values = ["pageBottom", "beneathText", "sectEnd", "docEnd"]

[enum.EndnotePos]
doc = "ST_EdnPos（§17.18.22）：尾注位置"
values = ["sectEnd", "docEnd"]

[enum.NumRestart]
doc = "ST_RestartNumber（§17.18.76）：脚注 / 尾注编号何时重新开始"
values = ["continuous", "eachSect", "eachPage"]

# ---- 节属性用到的结构体（任务 5.1）-----------------------------------------------------------------

[struct.HdrFtrRef]
doc = "CT_HdrFtrRef（`w:headerReference` / `w:footerReference`，§17.10.5）：指向 header / footer part 的关系 id 与种类。`w:type` 缺失视为 default（`RES-10`）。"
attrs = [
  { name = "id", attr = "r:id", codec = "Str" },
  { name = "kind", attr = "w:type", codec = "HdrFtrType" },
]

[struct.PageSz]
doc = "CT_PageSz（`w:pgSz`，§17.6.13）：`w`/`h` 是缇；`orient` 缺省 portrait（横向时 Word 仍把 w/h 按实际写）"
attrs = [
  { name = "w", attr = "w:w", codec = "Twips" },
  { name = "h", attr = "w:h", codec = "Twips" },
  { name = "orient", attr = "w:orient", codec = "PageOrient" },
  { name = "code", attr = "w:code", codec = "UInt", doc = "打印机纸型代码" },
]

[struct.PageMar]
doc = "CT_PageMar（`w:pgMar`，§17.6.11）：四边页边距 + 页眉页脚到纸边的距离 + 装订线，单位缇。上下可为负。两族拼写相同（不像 `w:ind` 有 start/end 改名）。"
attrs = [
  { name = "top", attr = "w:top", codec = "Twips" },
  { name = "right", attr = "w:right", codec = "Twips" },
  { name = "bottom", attr = "w:bottom", codec = "Twips" },
  { name = "left", attr = "w:left", codec = "Twips" },
  { name = "header", attr = "w:header", codec = "Twips", doc = "页眉顶端到纸边；页眉高过它就把正文往下推" },
  { name = "footer", attr = "w:footer", codec = "Twips" },
  { name = "gutter", attr = "w:gutter", codec = "Twips" },
]

[struct.LineNumber]
doc = "CT_LineNumber（`w:lnNumType`，§17.6.8）：行号"
attrs = [
  { name = "count_by", attr = "w:countBy", codec = "UInt", doc = "每几行显示一个行号" },
  { name = "start", attr = "w:start", codec = "Int" },
  { name = "distance", attr = "w:distance", codec = "Twips", doc = "行号与正文的距离" },
  { name = "restart", attr = "w:restart", codec = "LineNumberRestart" },
]

[struct.PageNumber]
doc = "CT_PageNumber（`w:pgNumType`，§17.6.12）：页码格式与起始值；`start` 缺失表示接着上一节数"
attrs = [
  { name = "fmt", attr = "w:fmt", codec = "NumberFormat" },
  { name = "start", attr = "w:start", codec = "Int" },
  { name = "chap_style", attr = "w:chapStyle", codec = "Int", doc = "章号取自哪一级标题样式" },
  { name = "chap_sep", attr = "w:chapSep", codec = "ChapterSep" },
]

[struct.DocGrid]
doc = "CT_DocGrid（`w:docGrid`，§17.6.5）：行网格；`linePitch` 影响行高取整"
attrs = [
  { name = "kind", attr = "w:type", codec = "DocGridType" },
  { name = "line_pitch", attr = "w:linePitch", codec = "Int" },
  { name = "char_space", attr = "w:charSpace", codec = "Int" },
]

[struct.Column]
doc = "CT_Column（`w:col`，§17.6.3）：不等宽分栏时每栏的宽度与右侧间距（最后一栏无 `w:space`）"
attrs = [
  { name = "w", attr = "w:w", codec = "Twips" },
  { name = "space", attr = "w:space", codec = "Twips" },
]
