[package]
name = "rsword-js"
version = "0.0.1"
description = "rsword 的 wasm 绑定（wasm-bindgen）：parse / parse_diagnostics / save / blank / version"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
compat-ts = ["rsword/compat-ts"]

[dependencies]
rsword = { path = "../rsword" }
# 与根 Cargo.lock 的版本锁死：wasm-bindgen-cli 必须同版本（见 TOOLS.md），否则生成的 glue 与运行时对不上
wasm-bindgen = "=0.2.128"
# 错误对象（js_sys::Error + `.code` 属性）；版本随 wasm-bindgen 对齐
js-sys = "0.3"
serde_json = "1"

[dev-dependencies]
# `parse_rejects_zip_without_main_part` 现造一个无主 part 的 zip
zip.workspace = true

# wasm-bindgen 的宏展开里有 `unsafe`：这个 crate 不能沿用 workspace 的 `unsafe_code = forbid`。
# 我们自己一行 `unsafe` 都不写（`allow` 只放行宏生成的那些）。
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
