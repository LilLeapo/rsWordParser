[package]
name = "rsword-js"
version = "0.0.1"
description = "rsword 的 JS 绑定（wasm-bindgen）：parse / save / blank / version"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rsword = { path = "../rsword" }
wasm-bindgen = "0.2"
js-sys = "0.3"

# wasm-bindgen 的宏展开里有 `unsafe`：这个 crate 不能沿用 workspace 的 `unsafe_code = forbid`。
# 我们自己一行 `unsafe` 都不写（`deny` 只放行宏生成的那些）。
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
